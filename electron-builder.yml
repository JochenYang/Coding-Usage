# electron-builder packaging configuration.
appId: com.coding-usage.app
productName: Coding Usage
# Explicit output dir (also the path the release workflow uploads from)
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - assets/**
# tokscale's platform binary must live outside the asar: spawning a process
# from inside the archive is not possible on any platform.
asarUnpack:
  - node_modules/@tokscale/**
  - node_modules/tokscale/**
win:
  # Rounded transparent app icon generated from assets/images/logo.png
  icon: build/icon.png
  # TODO(signing): wire Authenticode signing once a certificate is purchased.
  # With a physical/token cert (EV or OV) use one of:
  #   certificateSubjectName: "Your Company Ltd"     # OV, cert in the store
  #   certificateFile + certificatePassword          # PFX file via env var
  # electron-updater benefits from signed binaries: without a signature,
  # Windows SmartScreen and some AVs warn on install and on delta updates.
  target:
    - nsis
    - portable
mac:
  # Unsigned by design until an Apple Developer cert exists: Gatekeeper asks
  # for a one-time bypass (right-click Open / `xattr -cr`), documented in the
  # README and release notes. identity:null keeps CI from hunting keychains.
  icon: ./assets/images/logo.png
  category: public.app-category.developer-tools
  identity: null
  target:
    # zip feeds electron-updater on macOS; dmg is the human-facing installer
    - dmg
    - zip
linux:
  # AppImage needs no signing and runs on any glibc distro; deb/rpm can be
  # added later once install-method preferences are known.
  icon: ./assets/images/logo.png
  category: Development
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Used by electron-updater for auto-update feeds (latest.yml on GitHub Releases)
publish:
  provider: github
  owner: JochenYang
  repo: Coding-Usage
